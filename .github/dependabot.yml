version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

# SDK updates are done by hand: the SDK version also changes an implicit package in the lock
# files, so global.json and `dotnet restore --force-evaluate` must be updated together.
