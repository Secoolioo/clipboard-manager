name: Pages

# Publishes site/ plus the files from assets/ that it references to GitHub Pages.
# Repository setting required once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Each job gets only what it needs: building reads, only the deploy job can write to Pages.
permissions:
  contents: read

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/

          # Every same-site path the site uses: relative src/srcset/href values in the page, plus
          # absolute URLs below the site root (canonical, social images, JSON-LD, sitemap, robots).
          root='https://secoolioo.github.io/clipboard-manager/'
          {
            grep -oE '(src|srcset|href)="[^"#:?]+"' site/index.html | sed -E 's/^[a-z]+="//; s/"$//'
            grep -ohE 'https://secoolioo\.github\.io/clipboard-manager/[^"<>#?[:space:]]*' site/* | sed "s|^$root||"
          } | sort -u > "$RUNNER_TEMP/site-refs.txt"

          # Copy only the referenced repository assets, then fail before deploying if anything the
          # site points at is not in the artifact.
          missing=0
          while IFS= read -r ref; do
            case "$ref" in
              assets/*)
                if [ -f "$ref" ]; then
                  mkdir -p "_site/$(dirname "$ref")"
                  cp "$ref" "_site/$ref"
                fi
                ;;
            esac
            if [ ! -e "_site/$ref" ]; then
              echo "::error file=site/index.html::references missing file $ref"
              missing=1
            fi
          done < "$RUNNER_TEMP/site-refs.txt"
          exit "$missing"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
