name: Release

# Push a SemVer tag on main (e.g. v1.2.3) to build, attest and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build release files
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag $tag is not vMAJOR.MINOR.PATCH" }
          $version = $Matches[1]
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag does not point to a commit on main" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check maintainer commit identities
        shell: pwsh
        env:
          FORBIDDEN_IDENTITIES: ${{ secrets.FORBIDDEN_IDENTITIES }}
        run: ./build/check-identity.ps1

      - name: Restore (locked)
        run: dotnet restore ClipboardManager.sln --locked-mode

      - name: Build
        run: dotnet build ClipboardManager.sln -c Release --no-restore

      - name: Test (including real-clipboard integration tests)
        env:
          CM_INTEGRATION: "1"
        run: dotnet test --solution ClipboardManager.sln -c Release --no-build

      - name: Publish release files
        shell: pwsh
        run: ./build/publish-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Self-test the x64 EXE
        shell: pwsh
        run: ./build/selftest.ps1 -Exe artifacts/release/ClipboardManager.exe -Clipboard

      - name: Check the EXEs for build-machine paths
        shell: pwsh
        run: ./build/check-paths.ps1 -Path artifacts/release/ClipboardManager.exe, artifacts/release/ClipboardManager-arm64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            artifacts/release/*
            artifacts/release-notes.md
          retention-days: 7

  arm64-smoke:
    name: Self-test ARM64 build
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: artifacts
      - shell: pwsh
        run: ./build/selftest.ps1 -Exe artifacts/release/ClipboardManager-arm64.exe

  publish:
    name: Attest and publish
    needs: [build, arm64-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It runs no repository code: download, attest, upload.
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: artifacts

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/ClipboardManager.exe
            artifacts/release/ClipboardManager-arm64.exe
            artifacts/release/ClipboardManager-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "Clipboard Manager $VERSION" --notes-file artifacts/release-notes.md)
          # Final releases also open an announcement thread that watchers of the Discussions get.
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--discussion-category Announcements); fi
          gh release create "$TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
