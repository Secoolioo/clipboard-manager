name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste real clipboard content, passwords or personal data** – use made-up examples.
        Please do not attach crash dumps: they can contain your clipboard history.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text in Notepad
        2. Press Ctrl+Shift+V
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: "Settings → About (or right-click ClipboardManager.exe → Properties → Details)"
      placeholder: 0.10.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: |
        Paste the last entries of `%LOCALAPPDATA%\Secoolioo\ClipboardManager\logs\app.log` (paste that path into the Explorer address bar, or Settings → About → Open data folder → logs).
        The log never contains clipboard content.
      render: text
